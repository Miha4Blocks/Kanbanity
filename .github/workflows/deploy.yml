name: Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        timeout-minutes: 20
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 15m
          script: |
            set -eu
            test "$(id -un)" = "kanbanity" || { echo "SERVER_USER must be kanbanity" >&2; exit 1; }
            cd /opt/kanbanity
            git pull --ff-only origin main
            npm ci
            env NODE_OPTIONS="--max-old-space-size=2048" npm run build
            sudo -n systemctl restart kanbanity
            sleep 3
            curl -fsS http://127.0.0.1:3001/api/health
            html="$(curl -fsS http://127.0.0.1:3001/)"
            asset="$(printf '%s\n' "$html" | sed -n 's/.*src="\([^"]*\.js\)".*/\1/p')"
            test -n "$asset"
            bundle="$(curl -fsS "http://127.0.0.1:3001$asset")"
            if printf '%s' "$bundle" | grep -Fq 'crypto.randomUUID'; then
              echo "Deploy verification failed: served JavaScript still uses crypto.randomUUID" >&2
              exit 1
            fi
            echo "Deploy OK: $asset"
