name: Kanbanity CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Upload production build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: kanbanity-dist
          path: dist/
          if-no-files-found: error
          retention-days: 7